spring.application.name=order-service
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/btgorders
spring.datasource.username=btg
spring.datasource.password=btg123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Kafka
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.retries=3
spring.kafka.producer.properties.retry.backoff.ms=1000

# Actuator - health check
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Kafka topics
app.kafka.topic.orders=btg.orders
app.kafka.topic.orders-dlq=btg.orders.dlq

# Scheduler - reprocessa ordens pendentes a cada 5 minutos
app.scheduler.pending-orders.cron=0 */5 * * * *

