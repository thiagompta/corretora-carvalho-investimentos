name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-order-service:
    name: Testes — order-service (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Rodar testes
        run: mvn test
        working-directory: order-service

  test-notification-service:
    name: Testes — notification-service (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install
        working-directory: notification-service

  build-and-push:
    name: Build e Push Docker
    runs-on: ubuntu-latest
    needs: [test-order-service, test-notification-service]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build order-service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/btg-order-service:latest ./order-service
          docker push ${{ secrets.DOCKER_USERNAME }}/btg-order-service:latest

      - name: Build notification-service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/btg-notification-service:latest ./notification-service
          docker push ${{ secrets.DOCKER_USERNAME }}/btg-notification-service:latest
