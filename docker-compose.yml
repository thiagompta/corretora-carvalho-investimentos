services:

  # ── Redpanda (substituto do Kafka, compatível 100%) ─
  kafka:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=kafka:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── PostgreSQL ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: btgorders
      POSTGRES_USER: btg
      POSTGRES_PASSWORD: btg123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btg -d btgorders"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Order Service (Java) ───────────────────────────
  order-service:
    build: ./order-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/btgorders
      SPRING_DATASOURCE_USERNAME: btg
      SPRING_DATASOURCE_PASSWORD: btg123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Notification Service (Node.js) ─────────────────
  notification-service:
    build: ./notification-service
    ports:
      - "3000:3000"
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: btg.orders
      KAFKA_DLQ_TOPIC: btg.orders.dlq
      ORDER_SERVICE_URL: http://order-service:8080
    depends_on:
      kafka:
        condition: service_healthy
      order-service:
        condition: service_healthy

  # ── Frontend (React) ──────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      order-service:
        condition: service_healthy

volumes:
  postgres_data: